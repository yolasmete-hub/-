<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
	<rect width="1000" height="1000" fill="#181818"/>
	<defs>
		<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
			<circle cx="13" cy="13" r="5.5" fill="#2b2b2b"/>
		</pattern>
		<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#3a3a3a" stop-opacity="0.9"/>
			<stop offset="0.5" stop-color="#222" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.8"/>
		</linearGradient>
	</defs>
	<rect width="1000" height="1000" fill="url(#dots)"/>
	<circle cx="280" cy="330" r="190" fill="#333" opacity="0.55"/>
	<circle cx="640" cy="420" r="240" fill="#2f2f2f" opacity="0.6"/>
	<circle cx="480" cy="720" r="300" fill="#262626" opacity="0.7"/>
	<rect width="1000" height="1000" fill="url(#sheen)"/>
